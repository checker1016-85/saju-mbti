<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 MBTI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap');
:root{
  --bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--surface3:#272b3a;
  --border:#2a2f42;--border2:#363c52;
  --text:#e4e2dc;--text2:#8a8fa6;--text3:#5a5f76;
  --gold:#f0c040;--gold-dim:#a08020;
  --stat-money:#ffd740;--stat-play:#ff6090;--stat-lead:#8070ff;--stat-study:#40d8c0;--stat-solo:#ff7040;
  --wood:#50b060;--fire:#e05050;--earth:#d0a040;--metal:#a0a0b0;--water:#5080d0;
  --radius:10px;--gap:14px;--panel-w:340px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--surface);border-bottom:2px solid var(--gold-dim);padding:12px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--gold);letter-spacing:-.5px}
.header .sub{font-size:11px;color:var(--text2)}
.main{display:grid;grid-template-columns:var(--panel-w) 1fr minmax(280px,340px);height:calc(100vh - 50px)}
@media(max-width:1060px){.main{grid-template-columns:1fr;height:auto}}
.panel{border-right:1px solid var(--border);padding:var(--gap);overflow-y:auto;background:var(--surface)}
.panel:last-child{border-right:none}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.section-title{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:var(--gap);padding-bottom:6px;border-bottom:1px solid var(--border)}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:600}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--gold)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>*{flex:1}
.field{margin-bottom:10px}
.divider{border:none;border-top:1px solid var(--border);margin:var(--gap) 0}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.opt-row label{display:inline-flex;align-items:center;gap:4px;margin-bottom:0;cursor:pointer;white-space:nowrap}
.opt-row input[type="radio"],.opt-row input[type="checkbox"]{width:auto;margin:0;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;width:100%}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d4a020);color:#111;box-shadow:0 2px 12px #f0c04030}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-sub{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}
.btn-sub:hover{border-color:var(--gold);color:var(--gold)}

/* Saju Card */
.saju-card{background:var(--surface2);border-radius:var(--radius);padding:var(--gap);margin-bottom:var(--gap);border:1px solid var(--border)}
.pillar-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pillar{text-align:center;background:var(--surface3);border-radius:8px;padding:8px 4px;border:1px solid var(--border);min-height:72px}
.pillar .lbl{font-size:9px;color:var(--text3);margin-bottom:3px}
.pillar .gan{font-size:18px;font-weight:900;line-height:22px}
.pillar .ji{font-size:18px;font-weight:800;line-height:22px}
.pillar .info{font-size:9px;color:var(--text2);margin-top:2px}
.oh-wood{color:var(--wood)!important}.oh-fire{color:var(--fire)!important}
.oh-earth{color:var(--earth)!important}.oh-metal{color:var(--metal)!important}
.oh-water{color:var(--water)!important}
.oh-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}

/* Stat */
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stat-icon{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.stat-label{width:44px;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0}
.stat-bar-bg{flex:1;height:22px;background:var(--surface3);border-radius:11px;overflow:hidden;position:relative}
.stat-bar-fill{height:100%;border-radius:11px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.stat-bar-fill::after{content:attr(data-val);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#111}
.stat-rank{width:80px;text-align:right;flex-shrink:0;font-size:10px;color:var(--text2);line-height:1.3}
.stat-rank strong{color:var(--gold);font-size:12px;font-family:'Space Grotesk',sans-serif}
.stat-total{margin-top:4px;padding:12px;background:var(--surface3);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border)}
.stat-total .num{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;color:var(--gold)}
.stat-total .txt{font-size:11px;color:var(--text2)}
.stat-total .rank-info{text-align:right;font-size:11px;color:var(--text2);line-height:1.4}
.stat-total .rank-info strong{color:var(--gold);font-size:14px}

/* Type Card */
.type-card{background:linear-gradient(135deg,var(--surface2),var(--surface3));border-radius:var(--radius);padding:18px;margin:var(--gap) 0;border:1px solid var(--gold-dim);text-align:center}
.type-card .type-name{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:4px}
.type-card .type-sub{font-size:12px;color:var(--text2)}

/* Analysis Block */
.analysis-block{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-bottom:var(--gap);border:1px solid var(--border)}
.analysis-block .a-title{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:6px}
.analysis-block .a-body{font-size:13px;color:var(--text);line-height:1.7}
.strength-tag{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;margin:2px}

/* Job Select Button */
.job-select-btn{width:100%;padding:10px;background:var(--surface2);border:1px dashed var(--border2);border-radius:8px;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s;margin-bottom:var(--gap)}
.job-select-btn:hover{border-color:var(--gold);color:var(--text)}
.job-select-btn.selected{border-style:solid;border-color:var(--gold);color:var(--gold)}
.job-match-card{padding:14px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);text-align:center;margin-bottom:var(--gap)}
.job-match-pct{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700}
.job-match-msg{font-size:12px;color:var(--text2);margin-top:4px}
.job-match-rec{font-size:11px;color:var(--gold);margin-top:6px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:90%;max-width:680px;max-height:85vh;display:flex;flex-direction:column}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:16px;color:var(--gold)}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:var(--text)}
.modal-body{overflow-y:auto;padding:16px 20px;flex:1}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.jcat-title{font-size:12px;font-weight:800;color:var(--stat-play);margin:12px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.jcat-title:first-child{margin-top:0}
.jcat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.jcat-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s}
.jcat-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.jcat-btn.active{border-color:var(--gold);background:var(--gold);color:#111;font-weight:700}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.modal-footer .btn{flex:1}

/* Ranking */
.rank-filter{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.rank-filter button{padding:4px 8px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);font-size:10px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.rank-filter button:hover{color:var(--text)}
.rank-filter button.active{border-color:var(--gold);color:var(--gold);background:var(--surface3)}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{font-size:10px;color:var(--text3);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.rank-table td{font-size:11px;padding:6px;border-bottom:1px solid var(--border)}
.rank-table tr:hover td{background:var(--surface2)}
.rank-num{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--gold);width:24px}
.rank-name{font-weight:700}
.rank-score{font-family:'Space Grotesk',sans-serif;font-weight:700;text-align:right}
.rank-empty{text-align:center;padding:30px;color:var(--text3);font-size:12px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.placeholder{color:var(--text3);font-size:12px;text-align:center;padding:24px}
.age-display{font-size:13px;color:var(--text);padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
</style>
</head>
<body>
<div class="header">
  <h1>✦ 사주 MBTI</h1>
  <span class="sub">사주로 보는 내 기질·성향·적성</span>
</div>
<div class="main">

<!-- ═══ LEFT: 사주 입력 ═══ -->
<div class="panel">
  <div class="section-title">📋 사주 입력</div>
  <div class="row">
    <div class="field"><label>생년</label><input type="number" id="inYear" value="2000" min="1920" max="2010"></div>
    <div class="field"><label>월</label><select id="inMonth"></select></div>
    <div class="field"><label>일</label><select id="inDay"></select></div>
  </div>
  <div class="opt-row">
    <label><input type="radio" name="cal" value="solar" checked> 양력</label>
    <label><input type="radio" name="cal" value="lunar"> 음력</label>
    <label><input type="radio" name="cal" value="leap"> 윤달</label>
  </div>
  <div class="field"><label>시간</label><select id="inGanji" style="margin-bottom:6px"></select></div>
  <div class="opt-row">
    <label><input type="checkbox" id="chkNoTime"> 시간 모름</label>
    <label><input type="checkbox" id="chkYaja"> 야자시 적용안함</label>
  </div>
  <div class="row">
    <div class="field"><label>성별</label><select id="inGender"><option value="남">남</option><option value="여">여</option></select></div>
    <div class="field"><label>나이</label><div class="age-display" id="ageDisplay">—</div></div>
  </div>
  <div class="opt-row">
    <label><input type="radio" name="agetype" value="kr" checked> 한국나이</label>
    <label><input type="radio" name="agetype" value="man"> 만나이</label>
  </div>
  <button class="btn btn-gold" onclick="doCalc()">🔮 만세력 조회</button>

  <hr class="divider">
  <div class="section-title">🀄 사주 원국</div>
  <div id="sajuCardArea">
    <div class="saju-card"><div class="pillar-row">
      <div class="pillar"><div class="lbl">시주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div>
      <div class="pillar"><div class="lbl">일주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div>
      <div class="pillar"><div class="lbl">월주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div>
      <div class="pillar"><div class="lbl">년주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div>
    </div></div>
    <div class="placeholder">생년월일을 입력하세요</div>
  </div>

  <hr class="divider">
  <div class="section-title">📖 일주·월주 해석</div>
  <div id="interpArea"><div class="placeholder">만세력 조회 후 자동 표시됩니다.</div></div>
</div>

<!-- ═══ CENTER: 결과 ═══ -->
<div class="panel">
  <div class="section-title">💼 직업 선택</div>
  <button class="job-select-btn" id="jobSelectBtn" onclick="openJobModal()">🏷️ 직업 선택 (클릭)</button>
  <div id="centerResult"><div class="placeholder">만세력 조회 후 결과가 표시됩니다</div></div>
</div>

<!-- ═══ RIGHT: 랭킹 ═══ -->
<div class="panel">
  <div class="section-title">🏅 랭킹 보드</div>
  <div class="field"><label>닉네임</label><input type="text" id="inName" placeholder="이름 또는 닉네임" maxlength="12"></div>
  <button class="btn btn-gold" id="btnRegister" onclick="doRegister()" disabled style="margin-bottom:var(--gap)">📋 랭킹 등록</button>
  <div class="rank-filter" id="rankCatFilter"></div>
  <div id="rankTable"><div class="rank-empty">아직 등록된 참가자가 없습니다</div></div>
</div>

</div>

<!-- ═══ 직업 모달 ═══ -->
<div class="modal-overlay" id="jobModal">
  <div class="modal">
    <div class="modal-header"><h2>🏷️ 직업 선택</h2><button class="modal-close" onclick="closeJobModal()">✕</button></div>
    <div class="modal-body" id="jobModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-sub" onclick="closeJobModal()">취소</button>
      <button class="btn btn-gold" onclick="confirmJob()">✓ 선택 확인</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import{calculateSaju}from'https://cdn.jsdelivr.net/npm/ssaju@0.2.0/dist/index.mjs';
window._ssaju=calculateSaju;
</script>
<script>
// ════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════
const STEMS='甲乙丙丁戊己庚辛壬癸'.split('');
const BRANCHES='子丑寅卯辰巳午未申酉戌亥'.split('');
const ELEM_MAP={'甲':'목','乙':'목','丙':'화','丁':'화','戊':'토','己':'토','庚':'금','辛':'금','壬':'수','癸':'수','子':'수','丑':'토','寅':'목','卯':'목','辰':'토','巳':'화','午':'화','未':'토','申':'금','酉':'금','戌':'토','亥':'수'};
const ELEM_COLOR={목:'var(--wood)',화:'var(--fire)',토:'var(--earth)',금:'var(--metal)',수:'var(--water)'};
const OC={목:'oh-wood',화:'oh-fire',토:'oh-earth',금:'oh-metal',수:'oh-water'};

const GANJI_HOURS=[
  {label:'자시 子 (23:00~01:00)',h:0},{label:'축시 丑 (01:00~03:00)',h:2},
  {label:'인시 寅 (03:00~05:00)',h:4},{label:'묘시 卯 (05:00~07:00)',h:6},
  {label:'진시 辰 (07:00~09:00)',h:8},{label:'사시 巳 (09:00~11:00)',h:10},
  {label:'오시 午 (11:00~13:00)',h:12},{label:'미시 未 (13:00~15:00)',h:14},
  {label:'신시 申 (15:00~17:00)',h:16},{label:'유시 酉 (17:00~19:00)',h:18},
  {label:'술시 戌 (19:00~21:00)',h:20},{label:'해시 亥 (21:00~23:00)',h:22}
];

// 일간/일지 스탯 [재,놀,리,학,독]
const STEM_BASE={'甲':[35,30,65,45,75],'乙':[50,65,25,60,35],'丙':[40,75,65,35,50],'丁':[45,60,30,70,30],'戊':[55,25,70,40,65],'己':[65,35,45,60,30],'庚':[50,30,60,35,75],'辛':[70,50,30,60,35],'壬':[35,55,45,75,55],'癸':[55,50,25,70,40]};
const BRANCH_MOD={'子':[5,-5,0,15,5],'丑':[15,-5,5,5,0],'寅':[-5,5,10,0,15],'卯':[0,15,-5,10,0],'辰':[5,-5,15,5,10],'巳':[5,5,0,15,-5],'午':[0,15,10,-5,5],'未':[15,0,0,5,-5],'申':[10,0,5,5,15],'酉':[15,5,-5,10,-5],'戌':[0,-10,15,5,10],'亥':[0,10,-5,15,5]};
const MONTH_MOD={'寅':[0,2,3,0,5],'卯':[0,5,0,3,0],'辰':[2,0,5,2,3],'巳':[2,2,0,5,0],'午':[0,5,3,0,2],'未':[5,0,0,2,0],'申':[3,0,2,2,5],'酉':[5,2,0,3,0],'戌':[0,0,5,2,3],'亥':[0,3,0,5,2],'子':[2,0,0,5,2],'丑':[5,0,2,2,0]};
const STAT_KEYS=['재물력','놀기력','리더력','학습력','독립력'];

const ALL_60=[];
(function(){for(let i=0;i<60;i++){const s=STEMS[i%10],b=BRANCHES[i%12],sb=STEM_BASE[s],bm=BRANCH_MOD[b];const st={};STAT_KEYS.forEach((k,j)=>{st[k]=Math.max(0,Math.min(100,sb[j]+bm[j]));});st['종합전투력']=Math.round(st.재물력*.2+st.놀기력*.2+st.리더력*.25+st.학습력*.15+st.독립력*.2);ALL_60.push({gz:s+b,stem:s,branch:b,stats:st});}})();

function getRank60(key,score){const sc=ALL_60.map(x=>x.stats[key]).sort((a,b)=>b-a);let r=1;for(const s of sc){if(s>score)r++;else break;}return{rank:r,pct:Math.round((1-(r-1)/60)*100)};}

window.doCalc=function(){
  if(!window._ssaju){toast('⏳ 라이브러리 로딩 중...');return;}
  const noTime=document.getElementById('chkNoTime').checked;
  const hv=noTime?12:+document.getElementById('inGanji').value;
  const cal=document.querySelector('input[name="cal"]:checked').value;
  const r=window._ssaju({year:+document.getElementById('inYear').value,month:+document.getElementById('inMonth').value,day:+document.getElementById('inDay').value,hour:hv,minute:0,gender:document.getElementById('inGender').value,calendar:cal==='lunar'||cal==='leap'?'lunar':'solar'});
  S.saju=r;

  const pd=r.pillarDetails;
  const ds=pd?.day?.stem||'甲',db=pd?.day?.branch||'子',mb=pd?.month?.branch||'子';
  const base=STEM_BASE[ds]||STEM_BASE['甲'],bmod=BRANCH_MOD[db]||BRANCH_MOD['子'],mmod=MONTH_MOD[mb]||[0,0,0,0,0];
  const tgB=[0,0,0,0,0];
  if(r.tenGods){['year','month','day','hour'].forEach(p=>{if(!r.tenGods[p])return;[r.tenGods[p].stem,r.tenGods[p].branch].forEach(tg=>{if(!tg||tg==='(일간)'||tg==='일간')return;if(tg==='편재'||tg==='정재')tgB[0]+=2;if(tg==='식신'||tg==='상관')tgB[1]+=2;if(tg==='편관'||tg==='정관')tgB[2]+=2;if(tg==='편인'||tg==='정인')tgB[3]+=2;if(tg==='비견'||tg==='겁재')tgB[4]+=2;});});}
  const stats={};STAT_KEYS.forEach((k,j)=>{stats[k]=Math.max(0,Math.min(100,base[j]+bmod[j]+mmod[j]+tgB[j]));});
  stats['종합전투력']=Math.round(stats.재물력*.2+stats.놀기력*.2+stats.리더력*.25+stats.학습력*.15+stats.독립력*.2);
  const is={};STAT_KEYS.forEach((k,j)=>{is[k]=Math.max(0,Math.min(100,base[j]+bmod[j]));});
  is['종합전투력']=Math.round(is.재물력*.2+is.놀기력*.2+is.리더력*.25+is.학습력*.15+is.독립력*.2);
  S.stats=stats;S.iljuStats=is;

  renderSajuCard();renderInterp();renderCenter();updateRegBtn();
  toast('✅ 분석 완료');
};

  h+='</div>';
  const oh=getOh(r),ohT=Object.values(oh).reduce((a,b)=>a+b,1);

  const ilju=ds+db;
  let h=`<div class="analysis-block"><div class="a-title">🔥 ${ilju}일주 — ${ds}일간 기질</div><div class="a-body">${STEM_TEXT[ds]||''}</div></div>`;
  h+=`<div class="analysis-block"><div class="a-title">🌙 내면 에너지 — ${db}지</div><div class="a-body">${BRANCH_TEXT[db]||''}</div></div>`;
  h+=`<div class="analysis-block"><div class="a-title">🎭 사회적 페르소나 — ${mb}월</div><div class="a-body">${MONTH_TEXT[mb]||''}</div></div>`;
  document.getElementById('interpArea').innerHTML=h;
}

// ════════════════════════════════════════════
//  CENTER: 스탯 + 유형 + 적성
// ════════════════════════════════════════════
function renderCenter(){
  const st=S.stats,is=S.iljuStats,r=S.saju;if(!st)return;
  const pd=r.pillarDetails,ds=pd?.day?.stem||'甲',db=pd?.day?.branch||'子';
  const ilju=ds+db;
  const sorted=STAT_KEYS.map(k=>({k,v:st[k]})).sort((a,b)=>b.v-a.v);
  const top2key=sorted[0].k+'_'+sorted[1].k;
  const typeName=TYPE_NAMES[top2key]||'균형형 ⚖️';
  const adj=STEM_ADJ[ds]||'';

  let h=`<div class="type-card"><div class="type-name">${adj} ${typeName}</div><div class="type-sub">${ilju} · ${r.advanced?.geukguk||'—'}</div></div>`;
  h+=`<div style="text-align:center;margin-bottom:var(--gap)"><span class="strength-tag" style="background:${STAT_META.find(s=>s.key===sorted[0].k)?.color||'var(--gold)'}20;color:${STAT_META.find(s=>s.key===sorted[0].k)?.color}">강점: ${sorted[0].k} ${sorted[0].v}</span><span class="strength-tag" style="background:var(--surface3);color:var(--text3)">약점: ${sorted[4].k} ${sorted[4].v}</span></div>`;

  STAT_META.forEach(s=>{const val=st[s.key],rk=getRank60(s.key,is[s.key]);
    h+=`<div class="stat-row"><div class="stat-icon">${s.icon}</div><div class="stat-label">${s.key}</div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${val}%;background:${s.color}" data-val="${val}"></div></div><div class="stat-rank"><strong>${rk.rank}등</strong>/60<br>상위${rk.pct}%</div></div>`;});
  const tRk=getRank60('종합전투력',is['종합전투력']);
  h+=`<div class="stat-total"><div><div class="txt">종합 전투력</div><div class="num">${st.종합전투력}</div></div><div class="rank-info"><strong>${tRk.rank}등</strong>/60일주<br>상위 ${tRk.pct}%</div></div>`;

  if(S.job){
    const score=Math.round(st[S.job.primary]*.7+st[S.job.secondary]*.3);
    let best='',bestCat=null,bestSc=0;
    JOB_CATS.forEach(c=>{const sc=Math.round(st[c.primary]*.7+st[c.secondary]*.3);if(sc>bestSc){bestSc=sc;best=c.cat;bestCat=c;}});
    let msg='',color='';
    if(score>=80){msg='천직이에요! 🔥';color='var(--gold)';}
    else if(score>=60){msg='꽤 잘 맞아요 👍';color='var(--stat-study)';}
    else if(score>=40){msg='나쁘지 않아요 🤔';color='var(--text)';}
    else if(score>=20){msg='음... 전직 고려? 😅';color='var(--stat-play)';}
    else{msg='도망쳐!!! 🏃💨';color='var(--fire)';}
    h+=`<hr class="divider"><div class="section-title">🎯 직군 적성</div><div class="job-match-card"><div style="font-size:12px;color:var(--text2)">${S.jobName} (${S.jobCat})</div><div class="job-match-pct" style="color:${color}">${score}%</div><div class="job-match-msg">${msg}</div>${best!==S.jobCat?`<div class="job-match-rec">추천 분야: ${best} (${bestSc}%)</div>`:'<div class="job-match-rec">당신의 천직 분야입니다!</div>'}</div>`;
  }
  document.getElementById('centerResult').innerHTML=h;
}
function getOh(r){if(r.fiveElements)return r.fiveElements;const oh={목:0,화:0,토:0,금:0,수:0};['year','month','day','hour'].forEach(k=>{const p=r.pillarDetails?.[k];if(!p)return;const se=ELEM_MAP[p.stem];if(se)oh[se]++;const be=ELEM_MAP[p.branch];if(be)oh[be]++;});return oh;}

// ════════════════════════════════════════════
//  RIGHT: 랭킹
// ════════════════════════════════════════════
function updateRegBtn(){document.getElementById('btnRegister').disabled=!(S.stats&&S.job);}
window.doRegister=function(){
  if(!S.stats||!S.job)return;
  const name=document.getElementById('inName').value.trim()||'익명';
  const pd=S.saju.pillarDetails,ilju=(pd?.day?.stem||'')+(pd?.day?.branch||'');
  const players=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  const idx=players.findIndex(p=>p.name===name);
  const entry={name,jobName:S.jobName,jobCat:S.jobCat,ilju,stats:{...S.stats},timestamp:Date.now()};
  if(idx>=0)players[idx]=entry;else players.push(entry);
  localStorage.setItem(LS_KEY,JSON.stringify(players));
  renderRanking();toast(`✅ ${name} 등록!`);
};
let rankCat='종합전투력';
function renderRankFilters(){document.getElementById('rankCatFilter').innerHTML=RANK_CATS.map(c=>`<button class="${c.key===rankCat?'active':''}" onclick="setRankCat('${c.key}',this)">${c.label}</button>`).join('');}
window.setRankCat=function(c,el){rankCat=c;document.querySelectorAll('#rankCatFilter button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderRanking();};
function renderRanking(){
  let ps=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  ps.sort((a,b)=>(b.stats[rankCat]||0)-(a.stats[rankCat]||0));
  if(!ps.length){document.getElementById('rankTable').innerHTML='<div class="rank-empty">아직 등록된 참가자가 없습니다</div>';return;}
  let h='<table class="rank-table"><thead><tr><th>#</th><th>이름</th><th>일주</th><th>직업</th><th style="text-align:right">점수</th></tr></thead><tbody>';
  ps.forEach((p,i)=>{const m=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    h+=`<tr><td class="rank-num">${m||i+1}</td><td class="rank-name">${p.name}</td><td style="color:var(--gold)">${p.ilju}</td><td style="color:var(--text2);font-size:10px">${p.jobName||''}</td><td class="rank-score">${p.stats[rankCat]||0}</td></tr>`;});
  h+='</tbody></table>';document.getElementById('rankTable').innerHTML=h;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
