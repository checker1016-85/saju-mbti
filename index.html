<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 MBTI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="header"><h1>✦ 사주 MBTI</h1><span class="sub">사주로 보는 내 기질·성향·적성</span></div>
<div class="vstack">

<!-- ═══ 단락 1: 생년월일 입력 (2칼럼 가로, 세로 구분선) ═══ -->
<section class="block">
  <div class="block-title">📋 1. 생년월일 입력</div>
  <div class="birth-grid" style="position:relative">
    <div id="profileToast" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(42,37,32,.85);color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:700;z-index:10;white-space:nowrap;pointer-events:none;transition:opacity .3s"></div>
    <div class="birth-col birth-col-left">
      <div style="margin-bottom:12px">
        <label>이름</label>
        <input type="text" id="inName" placeholder="이름 입력 (저장 시 사용)">
      </div>
      <div class="row">
        <div class="field"><label>생년</label><input type="number" id="inYear" value="2000" min="1900" max="9999"></div>
        <div class="field"><label>월</label><select id="inMonth"></select></div>
        <div class="field"><label>일</label><select id="inDay"></select></div>
      </div>
      <div class="opt-row">
        <label><input type="radio" name="cal" value="solar" checked> 양력</label>
        <label><input type="radio" name="cal" value="lunar"> 음력</label>
        <label><input type="radio" name="cal" value="leap"> 윤달</label>
      </div>
      <label>시간</label>
      <div class="time-tabs">
        <div class="time-tab active" onclick="setTimeMode('ganji',this)">간지</div>
        <div class="time-tab" onclick="setTimeMode('direct',this)">시:분</div>
      </div>
      <div class="time-box">
        <div id="timeGanji"><select id="inGanji"></select></div>
        <div id="timeDirect" style="display:none"><div class="row" style="margin:0"><select id="inHour"></select><select id="inMin"></select></div></div>
      </div>
      <div class="opt-row">
        <label><input type="checkbox" id="chkNoTime"> 시간 모름</label>
        <label><input type="checkbox" id="chkYaja"> 야자시 적용</label>
      </div>
    </div>
    <div class="birth-col birth-col-right">
      <div class="row">
        <div class="field"><label>성별</label><select id="inGender"><option value="여">여</option><option value="남">남</option></select></div>
        <div class="field"><label>나이</label><select id="inAgeType"><option value="kr">한국나이</option><option value="man">만나이</option></select></div>
        <div class="field"><label>&nbsp;</label><div style="padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:center;height:36px;line-height:1.3;box-sizing:border-box" id="ageDisplay">—</div></div>
      </div>
      <label>출생지</label>
      <div class="time-tabs">
        <div class="time-tab active" onclick="setGeoMode('city',this)">도시 선택</div>
        <div class="time-tab" onclick="setGeoMode('coord',this)">위경도 직접</div>
      </div>
      <div class="geo-box">
        <div id="geoCity">
          <div class="row geo-3row">
            <select id="inCountry"></select>
            <select id="inRegion"></select>
            <select id="inCity"></select>
          </div>
          <div class="geo-coord-label" id="cityCoord">위도 —, 경도 —</div>
        </div>
        <div id="geoCoord" style="display:none">
          <div class="row geo-3row">
            <div class="coord-field"><span class="coord-prefix">위도</span><input type="number" id="inLat" value="37.5665" step="0.0001"></div>
            <div class="coord-field"><span class="coord-prefix">경도</span><input type="number" id="inLng" value="126.9780" step="0.0001"></div>
          </div>
          <div class="geo-coord-label">대한민국(서울) 기준 · 직접 수정 가능</div>
        </div>
      </div>
      <button class="btn btn-gold" onclick="doCalc()">만세력·점성차트 조회</button>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-sub" id="btnLoad" onclick="onLoadBtn()" style="flex:1;font-size:12px;padding:6px 0;white-space:nowrap">📂 불러오기</button>
        <button class="btn btn-sub" id="btnSave" onclick="saveProfile()" style="flex:1;font-size:12px;padding:6px 0;white-space:nowrap">💾 저장하기</button>
      </div>
    </div>
  </div>
</section>

<!-- ═══ 단락 2: 명리 → 점성 → 에니어그램 → MBTI ═══ -->
<section class="block">
  <div class="block-title">🔮 2. 성격 유형 분석</div>

  <div class="section-title-row">
    <span class="section-title" style="border:none;margin:0;padding:0">☯️ 명리 (사주)</span>
  </div>
  <div id="myungriArea"></div>

  <hr class="divider">
  <div class="section-title-row">
    <span class="section-title" style="border:none;margin:0;padding:0">🌌 점성 (Astrology)</span>
  </div>
  <div id="astroArea"></div>

  <!-- 숨김: 원국 데이터 렌더 타겟 (시각화 내부로 합쳐짐) -->
  <div id="sajuCardArea" style="display:none"></div>
  <div id="sajuMetaArea" style="display:none"></div>
  <div id="astroNatalArea" style="display:none"></div>

  <hr class="divider">
  <div class="section-title-row">
    <span class="section-title" style="border:none;margin:0;padding:0">🔷 에니어그램</span>
    <span><a class="test-link-btn" href="https://enneagram-personality.com/ko/" target="_blank">🔗 무료 검사</a> <button class="inline-select-btn" id="enneaSelBtn" onclick="openEnneaModal()">👆 직접 선택</button></span>
  </div>
  <div id="enneaArea"></div>

  <hr class="divider">
  <div class="section-title-row">
    <span class="section-title" style="border:none;margin:0;padding:0">🧠 MBTI</span>
    <span><a class="test-link-btn" href="https://www.16personalities.com/ko/%EB%AC%B4%EB%A3%8C-%EC%84%B1%EA%B2%A9-%EC%9C%A0%ED%98%95-%EA%B2%80%EC%82%AC" target="_blank">🔗 무료 검사</a> <button class="inline-select-btn" id="mbtiSelBtn" onclick="openMBTIModal()">👆 직접 선택</button></span>
  </div>
  <div id="mbtiArea"></div>
</section>

<!-- ═══ 단락 3: 스탯/레이더 + 직업 + 종합 ═══ -->
<section class="block">
  <div class="block-title">📊 3. 성향 프로필 · 적성</div>
  <div id="rightResult"><div class="placeholder">만세력 조회 후 표시됩니다</div></div>

  <hr class="divider">
  <div class="section-title">💼 직업 선택 (추가)</div>
  <button class="job-select-btn" id="jobSelectBtn" onclick="openJobModal()">🏷️ 직업 선택 (클릭)</button>
  <div id="jobRecArea"></div>
</section>

</div>

<!-- JOB MODAL -->
<div class="modal-overlay" id="jobModal">
  <div class="modal">
    <div class="modal-header"><h2>🏷️ 직업 선택</h2><button class="modal-close" onclick="closeJobModal()">✕</button></div>
    <div class="modal-body" id="jobModalBody"></div>
    <div class="modal-footer"><button class="btn btn-sub" onclick="closeJobModal()">취소</button><button class="btn btn-gold" onclick="confirmJob()">✓ 선택 확인</button></div>
  </div>
</div>

<!-- ENNEAGRAM MODAL -->
<div class="modal-overlay" id="enneaModal">
  <div class="modal">
    <div class="modal-header"><h2>🔷 에니어그램 선택</h2><button class="modal-close" onclick="closeEnneaModal()">✕</button></div>
    <div class="modal-body" id="enneaModalBody"></div>
    <div class="modal-footer"><button class="btn btn-sub" onclick="closeEnneaModal()">취소</button><button class="btn btn-gold" onclick="confirmEnnea()">✓ 선택 확인</button></div>
  </div>
</div>

<!-- MBTI MODAL -->
<div class="modal-overlay" id="mbtiModal">
  <div class="modal">
    <div class="modal-header"><h2>🧠 MBTI 선택</h2><button class="modal-close" onclick="closeMBTIModal()">✕</button></div>
    <div class="modal-body" id="mbtiModalBody"></div>
    <div class="modal-footer"><button class="btn btn-sub" onclick="closeMBTIModal()">취소</button><button class="btn btn-gold" onclick="confirmMBTI()">✓ 선택 확인</button></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script>window._lunarLib = {Solar, Lunar, EightChar, HolidayUtil};</script>
<script src="js/data.js"></script>
<script src="js/astro-data.js"></script>
<script src="js/radar.js"></script>
<script src="js/astro.js"></script>
<script src="js/saju-lunar.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
<!-- 프로필 불러오기 모달 -->
<div class="modal-overlay" id="profileModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header"><h2>📂 저장된 프로필</h2><button class="modal-close" onclick="closeLoadModal()">✕</button></div>
    <div class="modal-body" id="profileList" style="max-height:400px;overflow-y:auto;padding:12px"></div>
    <div class="modal-footer"><button class="btn btn-sub" onclick="closeLoadModal()">닫기</button></div>
  </div>
</div>

</body>
</html>
