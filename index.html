<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY JAM 2026 — 사주 배틀 랭킹</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap');
:root {
  --bg:#0d0f14; --surface:#161921; --surface2:#1e2230; --surface3:#272b3a;
  --border:#2a2f42; --border2:#363c52;
  --text:#e4e2dc; --text2:#8a8fa6; --text3:#5a5f76;
  --gold:#f0c040; --gold-dim:#a08020;
  --stat-money:#ffd740; --stat-play:#ff6090; --stat-lead:#8070ff;
  --stat-study:#40d8c0; --stat-solo:#ff7040;
  --wood:#50b060; --fire:#e05050; --earth:#d0a040; --metal:#a0a0b0; --water:#5080d0;
  --radius:10px; --gap:14px; --panel-w:340px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--surface);border-bottom:2px solid var(--gold-dim);padding:12px 24px;display:flex;align-items:center;gap:12px}
.header h1{font-family:'Space Grotesk',sans-serif;font-size:20px;color:var(--gold);letter-spacing:-.5px}
.header .sub{font-size:11px;color:var(--text2)}
.header .ver{font-size:10px;color:var(--text3);margin-left:auto}
.main{display:grid;grid-template-columns:var(--panel-w) minmax(320px,1fr) minmax(320px,1fr);height:calc(100vh - 50px)}
@media(max-width:1060px){.main{grid-template-columns:1fr;height:auto}}
.panel{border-right:1px solid var(--border);padding:var(--gap);overflow-y:auto;background:var(--surface)}
.panel:last-child{border-right:none}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.section-title{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:var(--gap);padding-bottom:6px;border-bottom:1px solid var(--border)}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:600}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--gold)}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1}
.field{margin-bottom:10px}
.divider{border:none;border-top:1px solid var(--border);margin:var(--gap) 0}
.opt-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.opt-row label{display:inline-flex;align-items:center;gap:4px;margin-bottom:0;cursor:pointer;white-space:nowrap}
.opt-row input[type="radio"]{width:auto;margin:0;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;width:100%}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d4a020);color:#111;box-shadow:0 2px 12px #f0c04030}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-sub{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}
.btn-sub:hover{border-color:var(--gold);color:var(--gold)}

/* Saju Card */
.saju-card{background:var(--surface2);border-radius:var(--radius);padding:var(--gap);margin-bottom:var(--gap);border:1px solid var(--border)}
.pillar-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pillar{text-align:center;background:var(--surface3);border-radius:8px;padding:8px 4px;border:1px solid var(--border);min-height:72px}
.pillar .lbl{font-size:9px;color:var(--text3);margin-bottom:3px}
.pillar .gan{font-size:18px;font-weight:900;line-height:22px}
.pillar .ji{font-size:18px;font-weight:800;line-height:22px}
.pillar .info{font-size:9px;color:var(--text2);margin-top:2px}
.oh-wood{color:var(--wood)!important}.oh-fire{color:var(--fire)!important}
.oh-earth{color:var(--earth)!important}.oh-metal{color:var(--metal)!important}
.oh-water{color:var(--water)!important}
.oh-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}

/* Stat Bars */
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stat-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.stat-label{width:48px;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0}
.stat-bar-bg{flex:1;height:24px;background:var(--surface3);border-radius:12px;overflow:hidden;position:relative}
.stat-bar-fill{height:100%;border-radius:12px;transition:width .6s cubic-bezier(.22,1,.36,1);position:relative}
.stat-bar-fill::after{content:attr(data-val);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:#111}
.stat-rank{width:90px;text-align:right;flex-shrink:0;font-size:10px;color:var(--text2);line-height:1.3}
.stat-rank strong{color:var(--gold);font-size:12px;font-family:'Space Grotesk',sans-serif}
.stat-total{margin-top:4px;padding:12px;background:var(--surface3);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border)}
.stat-total .num{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;color:var(--gold)}
.stat-total .txt{font-size:11px;color:var(--text2)}
.stat-total .rank-info{text-align:right;font-size:11px;color:var(--text2);line-height:1.4}
.stat-total .rank-info strong{color:var(--gold);font-size:14px}

/* Type Card */
.type-card{background:linear-gradient(135deg,var(--surface2),var(--surface3));border-radius:var(--radius);padding:20px;margin:var(--gap) 0;border:1px solid var(--gold-dim);text-align:center}
.type-card .type-name{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:4px}
.type-card .type-sub{font-size:12px;color:var(--text2)}

/* Job Grid */
.job-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:var(--gap)}
.job-btn{padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.job-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.job-btn.active{border-color:var(--gold);background:var(--gold);color:#111}
.job-btn .cat{font-size:9px;color:var(--text3);display:block;margin-top:1px}
.job-btn.active .cat{color:#333}
.job-match-card{padding:14px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);text-align:center;margin-bottom:var(--gap)}
.job-match-pct{font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:700}
.job-match-msg{font-size:12px;color:var(--text2);margin-top:4px}
.job-match-rec{font-size:11px;color:var(--gold);margin-top:6px}

/* Tabs */
.tab-bar{display:flex;gap:4px;margin-bottom:var(--gap)}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;background:var(--surface2);color:var(--text3);border:1px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface3);color:var(--gold);border-color:var(--gold-dim)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Ranking */
.rank-filter{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.rank-filter button{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);font-size:10px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.rank-filter button:hover{color:var(--text)}
.rank-filter button.active{border-color:var(--gold);color:var(--gold);background:var(--surface3)}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{font-size:10px;color:var(--text3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.rank-table td{font-size:12px;padding:8px;border-bottom:1px solid var(--border)}
.rank-table tr:hover td{background:var(--surface2)}
.rank-num{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--gold);width:28px}
.rank-name{font-weight:700}
.rank-score{font-family:'Space Grotesk',sans-serif;font-weight:700;text-align:right}
.rank-empty{text-align:center;padding:40px;color:var(--text3);font-size:12px}

/* Analysis */
.analysis-block{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-bottom:var(--gap);border:1px solid var(--border)}
.analysis-block .a-title{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:6px}
.analysis-block .a-body{font-size:13px;color:var(--text);line-height:1.7}
.strength-tag{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;margin:2px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.hidden{display:none!important}
.placeholder{color:var(--text3);font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<div class="header">
  <h1>🏆 PLAY JAM 2026</h1>
  <span class="sub">사주 배틀 랭킹</span>
  <span class="ver">v2.0</span>
</div>
<div class="main">

<!-- ═══ LEFT ═══ -->
<div class="panel">
  <div class="section-title">🎮 참가 정보</div>
  <div class="field"><label>닉네임</label><input type="text" id="inName" placeholder="이름 또는 닉네임" maxlength="12"></div>
  <div class="row">
    <div class="field"><label>생년</label><input type="number" id="inYear" value="1995" min="1920" max="2010"></div>
    <div class="field"><label>월</label><select id="inMonth"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option selected>12</option></select></div>
    <div class="field"><label>일</label><select id="inDay"></select></div>
  </div>
  <div class="opt-row">
    <label><input type="radio" name="cal" value="solar" checked> 양력</label>
    <label><input type="radio" name="cal" value="lunar"> 음력</label>
  </div>
  <div class="row">
    <div class="field"><label>시</label><select id="inHour"><option value="-1">모름</option></select></div>
    <div class="field"><label>분</label><select id="inMin"><option value="0">00</option></select></div>
    <div class="field"><label>성별</label><select id="inGender"><option value="남">남</option><option value="여">여</option></select></div>
  </div>
  <button class="btn btn-gold" onclick="doCalc()">🔮 사주 분석</button>
  <hr class="divider">
  <div class="section-title">💼 현재 직군</div>
  <div class="job-grid" id="jobGrid"></div>
  <button class="btn btn-gold" id="btnRegister" onclick="doRegister()" disabled>📋 랭킹 등록</button>
</div>

<!-- ═══ CENTER ═══ -->
<div class="panel">
  <div class="section-title">📊 분석 결과</div>
  <div id="resultArea"><div class="placeholder">사주를 분석하면 여기에 결과가 표시됩니다</div></div>
</div>

<!-- ═══ RIGHT ═══ -->
<div class="panel">
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('ranking',this)">🏅 랭킹</div>
    <div class="tab" onclick="switchTab('analysis',this)">📋 성향 분석</div>
  </div>
  <div class="tab-content active" id="tabRanking">
    <div class="rank-filter" id="rankCatFilter"></div>
    <div class="rank-filter" id="rankJobFilter"></div>
    <div id="rankTable"><div class="rank-empty">아직 등록된 참가자가 없습니다</div></div>
  </div>
  <div class="tab-content" id="tabAnalysis">
    <div id="analysisArea"><div class="placeholder">사주 분석 후 성향이 표시됩니다</div></div>
  </div>
</div>

</div>
<div id="toast" class="toast"></div>

<script type="module">
import { calculateSaju } from 'https://cdn.jsdelivr.net/npm/ssaju@0.2.0/dist/index.mjs';
window._ssaju = calculateSaju;
</script>
<script>
// ═══════════════════════════════════════════════════════════
//  데이터 정의
// ═══════════════════════════════════════════════════════════
const STEMS = '甲乙丙丁戊己庚辛壬癸'.split('');
const BRANCHES = '子丑寅卯辰巳午未申酉戌亥'.split('');
const ELEM_MAP = {'甲':'목','乙':'목','丙':'화','丁':'화','戊':'토','己':'토','庚':'금','辛':'금','壬':'수','癸':'수',
  '子':'수','丑':'토','寅':'목','卯':'목','辰':'토','巳':'화','午':'화','未':'토','申':'금','酉':'금','戌':'토','亥':'수'};
const ELEM_COLOR = {목:'var(--wood)',화:'var(--fire)',토:'var(--earth)',금:'var(--metal)',수:'var(--water)'};
const OC = {목:'oh-wood',화:'oh-fire',토:'oh-earth',금:'oh-metal',수:'oh-water'};

// 일간 기본 스탯 [재물,놀기,리더,학습,독립]
const STEM_BASE = {
  '甲':[35,30,65,45,75],'乙':[50,65,25,60,35],'丙':[40,75,65,35,50],
  '丁':[45,60,30,70,30],'戊':[55,25,70,40,65],'己':[65,35,45,60,30],
  '庚':[50,30,60,35,75],'辛':[70,50,30,60,35],'壬':[35,55,45,75,55],'癸':[55,50,25,70,40]
};
// 일지 보정 [재물,놀기,리더,학습,독립]
const BRANCH_MOD = {
  '子':[5,-5,0,15,5],'丑':[15,-5,5,5,0],'寅':[-5,5,10,0,15],
  '卯':[0,15,-5,10,0],'辰':[5,-5,15,5,10],'巳':[5,5,0,15,-5],
  '午':[0,15,10,-5,5],'未':[15,0,0,5,-5],'申':[10,0,5,5,15],
  '酉':[15,5,-5,10,-5],'戌':[0,-10,15,5,10],'亥':[0,10,-5,15,5]
};

// 월지 보정 (사회적 페르소나, 작은 보정)
const MONTH_BRANCH_MOD = {
  '寅':[0,2,3,0,5],'卯':[0,5,0,3,0],'辰':[2,0,5,2,3],
  '巳':[2,2,0,5,0],'午':[0,5,3,0,2],'未':[5,0,0,2,0],
  '申':[3,0,2,2,5],'酉':[5,2,0,3,0],'戌':[0,0,5,2,3],
  '亥':[0,3,0,5,2],'子':[2,0,0,5,2],'丑':[5,0,2,2,0]
};

const STAT_KEYS = ['재물력','놀기력','리더력','학습력','독립력'];
const STAT_META = [
  {key:'재물력',icon:'💰',color:'var(--stat-money)'},
  {key:'놀기력',icon:'🎉',color:'var(--stat-play)'},
  {key:'리더력',icon:'👑',color:'var(--stat-lead)'},
  {key:'학습력',icon:'🧠',color:'var(--stat-study)'},
  {key:'독립력',icon:'⚔️',color:'var(--stat-solo)'}
];

// ── 일간별 기질 텍스트 ──
const STEM_TEXT = {
  '甲':'거침없는 선구자. 큰 나무처럼 곧고 당당하며, 한번 정한 방향은 꺾이지 않는다. 조직에서 앞장서서 길을 내는 개척형.',
  '乙':'유연한 적응가. 덩굴처럼 어디든 뿌리내리며, 부드러움 속에 강인함이 있다. 어떤 팀에 들어가도 자연스럽게 녹아든다.',
  '丙':'타오르는 열정가. 태양 같은 에너지로 주변을 밝히며, 무대 위에서 빛나는 타입. 분위기를 주도하고 사람을 끌어당긴다.',
  '丁':'정밀한 통찰가. 촛불 같은 집중력으로 깊이 파고들며, 섬세한 감각의 소유자. 디테일에서 승부를 거는 장인.',
  '戊':'흔들림 없는 기반. 산처럼 묵직하고 신뢰감 있으며, 조직의 중심이 되는 사람. 위기에 강하고 쉽게 흔들리지 않는다.',
  '己':'포용하는 관리자. 대지처럼 모든 것을 수용하며, 실리와 조화를 동시에 추구한다. 자원을 효율적으로 운용하는 능력이 탁월.',
  '庚':'날카로운 실행가. 강철 같은 결단력으로 밀어붙이며, 원칙에 타협하지 않는다. 문제를 정면 돌파하는 전사형.',
  '辛':'빛나는 완벽주의자. 보석 같은 정교함을 추구하며, 디테일에서 차이를 만든다. 결과물의 퀄리티에 강한 집착.',
  '壬':'깊은 전략가. 대해 같은 지혜로 큰 그림을 보며, 유연하게 흐름을 읽는다. 장기적 시야로 판을 짜는 사람.',
  '癸':'직관의 관찰자. 비처럼 조용히 스며들며, 남들이 못 보는 것을 감지한다. 데이터 너머의 인사이트를 뽑아내는 능력.'
};

// ── 일지별 내면 에너지 ──
const BRANCH_TEXT = {
  '子':'내면에 학구적 호기심이 끓는다. 밤의 고요함 속에서 영감을 얻는 타입으로, 혼자만의 시간에 최고 성과를 낸다.',
  '丑':'차곡차곡 쌓는 실질적 내면. 느리지만 확실한 성장을 추구하며, 기반을 단단히 다지는 데 능하다.',
  '寅':'모험심과 도전 의지가 강하다. 새벽의 호랑이처럼 먼저 움직이며, 미지의 영역에 두려움이 없다.',
  '卯':'감성과 표현력이 풍부한 내면. 예술적 감각이 자연스럽게 발현되며, 사람들과의 교류에서 에너지를 얻는다.',
  '辰':'야심과 변화를 품은 내면. 용처럼 더 높은 곳을 향해 비상하려 하며, 현재에 안주하지 않는 변혁가.',
  '巳':'사색적이고 통찰력 있는 내면. 핵심을 꿰뚫는 직관이 있으며, 복잡한 문제를 단순화하는 능력이 뛰어나다.',
  '午':'에너지가 넘치고 열정적인 내면. 한낮의 태양처럼 활발하고, 행동이 빠르며 순발력이 좋다.',

const ALL_60 = [];
(function build60() {
  for(let i=0;i<60;i++) {
    const stem = STEMS[i%10], branch = BRANCHES[i%12];
    const b = STEM_BASE[stem], m = BRANCH_MOD[branch];
    const stats = {};
    STAT_KEYS.forEach((k,j) => { stats[k] = Math.max(0, Math.min(100, b[j]+m[j])); });
    stats['종합전투력'] = Math.round(stats.재물력*0.2+stats.놀기력*0.2+stats.리더력*0.25+stats.학습력*0.15+stats.독립력*0.2);
    ALL_60.push({ gz: stem+branch, stem, branch, stats });
  }
})();

function getRank60(statKey, myScore) {
  const scores = ALL_60.map(x => x.stats[statKey]).sort((a,b)=>b-a);
  let rank = 1;
  for(const sc of scores) { if(sc > myScore) rank++; else break; }
  return { rank, pct: Math.round((1 - (rank-1)/60)*100) };
}

window.doCalc=function(){
  if(!window._ssaju){toast('⏳ 라이브러리 로딩 중...');return;}
  const hv=+document.getElementById('inHour').value;
  const r=window._ssaju({
    year:+document.getElementById('inYear').value,
    month:+document.getElementById('inMonth').value,
    day:+document.getElementById('inDay').value,
    hour:hv===-1?12:hv, minute:hv===-1?0:+document.getElementById('inMin').value,
    gender:document.getElementById('inGender').value,
    calendar:document.querySelector('input[name="cal"]:checked').value==='solar'?'solar':'lunar'
  });
  S.saju=r; S.name=document.getElementById('inName').value.trim()||'익명';

  // 일주 기반 스탯
  const pd=r.pillarDetails;
  const dayStem=pd?.day?.stem||'甲', dayBranch=pd?.day?.branch||'子';
  const monthBranch=pd?.month?.branch||'子';
  S.monthBranch=monthBranch;

  const base=STEM_BASE[dayStem]||STEM_BASE['甲'];
  const bmod=BRANCH_MOD[dayBranch]||BRANCH_MOD['子'];
  const mmod=MONTH_BRANCH_MOD[monthBranch]||[0,0,0,0,0];

  // 십성 미세보정
  const tgBonus=[0,0,0,0,0];
  if(r.tenGods){
    ['year','month','day','hour'].forEach(p=>{
      if(!r.tenGods[p])return;
      [r.tenGods[p].stem,r.tenGods[p].branch].forEach(tg=>{
        if(!tg||tg==='(일간)'||tg==='일간')return;
        if(tg==='편재'||tg==='정재')tgBonus[0]+=2;
        if(tg==='식신'||tg==='상관')tgBonus[1]+=2;
        if(tg==='편관'||tg==='정관')tgBonus[2]+=2;
        if(tg==='편인'||tg==='정인')tgBonus[3]+=2;
        if(tg==='비견'||tg==='겁재')tgBonus[4]+=2;
      });
    });
  }

  const stats={};
  STAT_KEYS.forEach((k,j)=>{
    stats[k]=Math.max(0,Math.min(100, base[j]+bmod[j]+mmod[j]+tgBonus[j]));
  });
  stats['종합전투력']=Math.round(stats.재물력*0.2+stats.놀기력*0.2+stats.리더력*0.25+stats.학습력*0.15+stats.독립력*0.2);

  // 일주 기본 스탯 (월주/십성 보정 전, 순위용)
  const iljuStats={};
  STAT_KEYS.forEach((k,j)=>{ iljuStats[k]=Math.max(0,Math.min(100,base[j]+bmod[j])); });
  iljuStats['종합전투력']=Math.round(iljuStats.재물력*0.2+iljuStats.놀기력*0.2+iljuStats.리더력*0.25+iljuStats.학습력*0.15+iljuStats.독립력*0.2);
  S.iljuStats=iljuStats;
  S.stats=stats;

  renderResult();
  renderAnalysis();
  updateRegBtn();
  toast('✅ 사주 분석 완료');
};

  h+='</div><div style="display:flex;justify-content:center;gap:10px;margin-top:4px">';
  for(const[e,c]of Object.entries(oh)) h+=`<span style="font-size:10px;color:${ELEM_COLOR[e]}">${e}${c}</span>`;
  h+='</div></div>';

  // 유형
  const sorted=STAT_KEYS.map(k=>({k,v:st[k]})).sort((a,b)=>b.v-a.v);
  const top2key=sorted[0].k+'_'+sorted[1].k;

function renderJobMatch(){
  const area=document.getElementById('jobMatchArea');
  if(!area||!S.stats||!S.job)return;
  const map=JOB_MAP[S.job], score=Math.round(S.stats[map.primary]*0.7+S.stats[map.secondary]*0.3);
  const jobName=JOBS.find(j=>j.id===S.job)?.name||'';
  let best='',bestSc=0;
  JOBS.forEach(j=>{const m=JOB_MAP[j.id];const sc=Math.round(S.stats[m.primary]*0.7+S.stats[m.secondary]*0.3);if(sc>bestSc){bestSc=sc;best=j.name;}});
  let msg='',color='';
  if(score>=80){msg='천직이에요! 🔥';color='var(--gold)';}
  else if(score>=60){msg='꽤 잘 맞아요 👍';color='var(--stat-study)';}
  else if(score>=40){msg='나쁘지 않아요 🤔';color='var(--text)';}
  else if(score>=20){msg='음... 전직 고려? 😅';color='var(--stat-play)';}
  else{msg='도망쳐!!! 🏃💨';color='var(--fire)';}
  area.innerHTML=`<hr class="divider"><div class="section-title">🎯 직군 적성</div>
    <div class="job-match-card"><div style="font-size:12px;color:var(--text2)">${jobName} 적성</div>
    <div class="job-match-pct" style="color:${color}">${score}%</div>
    <div class="job-match-msg">${msg}</div>
    ${best!==jobName?`<div class="job-match-rec">추천 직군: ${best} (${bestSc}%)</div>`:'<div class="job-match-rec">당신의 천직입니다!</div>'}</div>`;
}

function getOh(r){
  if(r.fiveElements)return r.fiveElements;
  const oh={목:0,화:0,토:0,금:0,수:0};
  ['year','month','day','hour'].forEach(k=>{const p=r.pillarDetails?.[k];if(!p)return;const se=ELEM_MAP[p.stem];if(se)oh[se]++;const be=ELEM_MAP[p.branch];if(be)oh[be]++;});
  return oh;
}

function renderAnalysis(){
  const r=S.saju, st=S.stats;
  if(!r||!st){document.getElementById('analysisArea').innerHTML='<div class="placeholder">사주 분석 후 표시됩니다</div>';return;}
  const pd=r.pillarDetails;
  const dayStem=pd?.day?.stem||'甲', dayBranch=pd?.day?.branch||'子';
  const monthBranch=pd?.month?.branch||'子';
  const ilju=dayStem+dayBranch;

  // 유형
  const sorted=STAT_KEYS.map(k=>({k,v:st[k]})).sort((a,b)=>b.v-a.v);
  const top2key=sorted[0].k+'_'+sorted[1].k;
  const typeName=TYPE_NAMES[top2key]||'균형형 ⚖️';
  const adj=STEM_ADJ[dayStem]||'';

  // 강점/약점
  const strongest=sorted[0], weakest=sorted[sorted.length-1];

  let h=`<div class="type-card"><div class="type-name">${adj} ${typeName}</div><div class="type-sub">${ilju} · ${r.advanced?.geukguk||'—'}</div></div>`;

  // 강점/약점 태그
  h+=`<div style="text-align:center;margin-bottom:var(--gap)">
    <span class="strength-tag" style="background:${STAT_META.find(s=>s.key===strongest.k)?.color||'var(--gold)'}20;color:${STAT_META.find(s=>s.key===strongest.k)?.color||'var(--gold)'}">강점: ${strongest.k} ${strongest.v}</span>
    <span class="strength-tag" style="background:var(--surface3);color:var(--text3)">약점: ${weakest.k} ${weakest.v}</span>
  </div>`;

  // 일간 기질
  h+=`<div class="analysis-block"><div class="a-title">🔥 핵심 기질 — ${dayStem}일간</div><div class="a-body">${STEM_TEXT[dayStem]||''}</div></div>`;

  // 일지 내면
  h+=`<div class="analysis-block"><div class="a-title">🌙 내면 에너지 — ${dayBranch}지</div><div class="a-body">${BRANCH_TEXT[dayBranch]||''}</div></div>`;

  // 월주 페르소나
  h+=`<div class="analysis-block"><div class="a-title">🎭 사회적 페르소나 — ${monthBranch}월</div><div class="a-body">${MONTH_TEXT[monthBranch]||''}</div></div>`;

  // 종합 요약
  h+=`<div class="analysis-block"><div class="a-title">📝 종합 요약</div><div class="a-body">
    <b>${ilju}일주</b>의 당신은 <b>${adj}</b> 기질을 가진 <b>${typeName.replace(/[^\w가-힣]/g,'')}</b>입니다.
    내면에는 ${dayBranch}지의 에너지가 흐르고, 사회적으로는 ${monthBranch}월의 페르소나로 표현됩니다.
    <br><br>60일주 중 <b>${strongest.k}</b>이 가장 강하며(${getRank60(strongest.k,S.iljuStats[strongest.k]).rank}등),
    <b>${weakest.k}</b>은 상대적으로 보완이 필요한 영역(${getRank60(weakest.k,S.iljuStats[weakest.k]).rank}등)입니다.
    ${r.advanced?.geukguk?`<br>격국은 <b>${r.advanced.geukguk}</b>으로, 이 기질의 방향성을 더 강화합니다.`:''}
  </div></div>`;

  document.getElementById('analysisArea').innerHTML=h;
}

// ═══════════════════════════════════════════════════════════
//  등록 + 랭킹
// ═══════════════════════════════════════════════════════════
window.doRegister=function(){
  if(!S.stats||!S.job)return;
  const pd=S.saju.pillarDetails, ilju=(pd?.day?.stem||'')+(pd?.day?.branch||'');
  const jobName=JOBS.find(j=>j.id===S.job)?.name||'';
  const players=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  const idx=players.findIndex(p=>p.name===S.name);
  const entry={name:S.name,dept:S.job,deptName:jobName,ilju,stats:{...S.stats},timestamp:Date.now()};
  if(idx>=0)players[idx]=entry;else players.push(entry);
  localStorage.setItem(LS_KEY,JSON.stringify(players));
  renderRanking(); toast(`✅ ${S.name} 등록 완료!`);
};

let rankCat='종합전투력', rankJobFilter=null;
function renderRankFilters(){
  document.getElementById('rankCatFilter').innerHTML=RANK_CATS.map(c=>`<button class="${c.key===rankCat?'active':''}" onclick="setRankCat('${c.key}',this)">${c.label}</button>`).join('');
  document.getElementById('rankJobFilter').innerHTML=`<button class="${!rankJobFilter?'active':''}" onclick="setRankJob(null,this)">전체</button>`+[...new Set(JOBS.map(j=>j.cat))].map(cat=>`<button class="${rankJobFilter===cat?'active':''}" onclick="setRankJob('${cat}',this)">${cat}</button>`).join('');
}
window.setRankCat=function(c,el){rankCat=c;document.querySelectorAll('#rankCatFilter button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderRanking();};
window.setRankJob=function(c,el){rankJobFilter=c;document.querySelectorAll('#rankJobFilter button').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderRanking();};

function renderRanking(){
  let players=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  if(rankJobFilter){const ids=JOBS.filter(j=>j.cat===rankJobFilter).map(j=>j.id);players=players.filter(p=>ids.includes(p.dept));}
  players.sort((a,b)=>(b.stats[rankCat]||0)-(a.stats[rankCat]||0));
  if(!players.length){document.getElementById('rankTable').innerHTML='<div class="rank-empty">아직 등록된 참가자가 없습니다</div>';return;}
  let h='<table class="rank-table"><thead><tr><th>#</th><th>이름</th><th>일주</th><th>직군</th><th style="text-align:right">점수</th></tr></thead><tbody>';
  players.forEach((p,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    h+=`<tr><td class="rank-num">${medal||i+1}</td><td class="rank-name">${p.name}</td><td style="color:var(--gold)">${p.ilju}</td><td style="color:var(--text2);font-size:11px">${p.deptName||''}</td><td class="rank-score">${p.stats[rankCat]||0}</td></tr>`;
  });
  h+='</tbody></table>';document.getElementById('rankTable').innerHTML=h;
}

// ═══ 탭 ═══
window.switchTab=function(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(tab==='ranking'?'tabRanking':'tabAnalysis').classList.add('active');
};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
