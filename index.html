<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 MBTI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap');
:root{--bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--surface3:#272b3a;--border:#2a2f42;--border2:#363c52;--text:#e4e2dc;--text2:#8a8fa6;--text3:#5a5f76;--gold:#f0c040;--gold-dim:#a08020;--stat-money:#ffd740;--stat-play:#ff6090;--stat-lead:#8070ff;--stat-study:#40d8c0;--stat-solo:#ff7040;--wood:#50b060;--fire:#e05050;--earth:#d0a040;--metal:#a0a0b0;--water:#5080d0;--radius:10px;--gap:14px;--panel-w:320px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:var(--surface);border-bottom:2px solid var(--gold-dim);padding:12px 24px;display:flex;align-items:center;gap:12px}.header h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--gold)}.header .sub{font-size:11px;color:var(--text2)}
.main{display:grid;grid-template-columns:var(--panel-w) 1fr var(--panel-w);height:calc(100vh - 50px)}@media(max-width:1060px){.main{grid-template-columns:1fr;height:auto}}
.panel{border-right:1px solid var(--border);padding:var(--gap);overflow-y:auto;background:var(--surface)}.panel:last-child{border-right:none}.panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.section-title{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;margin-bottom:var(--gap);padding-bottom:6px;border-bottom:1px solid var(--border)}
label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:600}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border .2s}input:focus,select:focus{border-color:var(--gold)}
.row{display:flex;gap:8px;margin-bottom:10px}.row>*{flex:1}.field{margin-bottom:10px}
.divider{border:none;border-top:1px solid var(--border);margin:var(--gap) 0}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}.opt-row label{display:inline-flex;align-items:center;gap:4px;margin-bottom:0;cursor:pointer;white-space:nowrap}.opt-row input[type="radio"],.opt-row input[type="checkbox"]{width:auto;margin:0;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;width:100%}.btn-gold{background:linear-gradient(135deg,var(--gold),#d4a020);color:#111;box-shadow:0 2px 12px #f0c04030}.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}.btn-sub{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}.btn-sub:hover{border-color:var(--gold);color:var(--gold)}
.time-tabs{display:flex;gap:0;margin-bottom:6px}.time-tab{flex:1;padding:6px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--text3);border:1px solid var(--border);transition:all .15s}.time-tab:first-child{border-radius:6px 0 0 6px}.time-tab:last-child{border-radius:0 6px 6px 0}.time-tab.active{background:var(--gold);color:#111;border-color:var(--gold)}
.saju-card{background:var(--surface2);border-radius:var(--radius);padding:var(--gap);margin-bottom:var(--gap);border:1px solid var(--border)}.pillar-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pillar{text-align:center;background:var(--surface3);border-radius:8px;padding:8px 4px;border:1px solid var(--border);min-height:72px}.pillar .lbl{font-size:9px;color:var(--text3);margin-bottom:3px}.pillar .gan{font-size:18px;font-weight:900;line-height:22px}.pillar .ji{font-size:18px;font-weight:800;line-height:22px}.pillar .info{font-size:9px;color:var(--text2);margin-top:2px}
.oh-wood{color:var(--wood)!important}.oh-fire{color:var(--fire)!important}.oh-earth{color:var(--earth)!important}.oh-metal{color:var(--metal)!important}.oh-water{color:var(--water)!important}
.oh-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}
.analysis-block{background:var(--surface2);border-radius:var(--radius);padding:12px;margin-bottom:10px;border:1px solid var(--border)}.analysis-block .a-title{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:4px}.analysis-block .a-body{font-size:12px;color:var(--text);line-height:1.6}
.type-card{background:linear-gradient(135deg,var(--surface2),var(--surface3));border-radius:var(--radius);padding:16px;margin-bottom:var(--gap);border:1px solid var(--gold-dim);text-align:center}.type-card .type-name{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:4px}.type-card .type-sub{font-size:12px;color:var(--text2)}
.mbti-card{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:var(--gap)}.mbti-code{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--stat-lead)}.mbti-desc{font-size:11px;color:var(--text2);text-align:left;max-width:180px}
.radar-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:var(--gap)}
.radar-box{background:var(--surface2);border-radius:var(--radius);padding:10px;border:1px solid var(--border);text-align:center}.radar-box .r-title{font-size:11px;font-weight:800;margin-bottom:6px}
.job-select-btn{width:100%;padding:10px;background:var(--surface2);border:1px dashed var(--border2);border-radius:8px;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s;margin-bottom:8px}.job-select-btn:hover{border-color:var(--gold);color:var(--text)}.job-select-btn.selected{border-style:solid;border-color:var(--gold);color:var(--gold)}
.job-rec{background:var(--surface2);border-radius:var(--radius);padding:10px;border:1px solid var(--border);margin-bottom:var(--gap);font-size:11px;color:var(--text2);line-height:1.6}.job-rec strong{color:var(--gold)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center}.modal-overlay.show{display:flex}.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:90%;max-width:680px;max-height:85vh;display:flex;flex-direction:column}.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}.modal-header h2{font-size:16px;color:var(--gold)}.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px 8px}.modal-close:hover{color:var(--text)}.modal-body{overflow-y:auto;padding:14px 20px;flex:1}.modal-body::-webkit-scrollbar{width:4px}.modal-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.jcat-title{font-size:12px;font-weight:800;color:var(--stat-play);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}.jcat-title:first-child{margin-top:0}.jcat-title .rec-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:var(--gold);color:#111;margin-left:6px;font-weight:800}
.jcat-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}.jcat-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}.jcat-btn:hover{border-color:var(--gold-dim);color:var(--text)}.jcat-btn.active{border-color:var(--gold);background:var(--gold);color:#111;font-weight:700}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px}.modal-footer .btn{flex:1}
.modal-rec-banner{background:var(--surface3);border:1px solid var(--gold-dim);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--text);line-height:1.6}.modal-rec-banner strong{color:var(--gold)}
.strength-tag{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;margin:2px}
.right-card{background:var(--surface2);border-radius:var(--radius);padding:12px;margin-bottom:10px;border:1px solid var(--border)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}.toast.show{opacity:1}
.placeholder{color:var(--text3);font-size:12px;text-align:center;padding:24px}
.age-display{font-size:13px;color:var(--text);padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
</style>
</head>
<body>
<div class="header"><h1>✦ 사주 MBTI</h1><span class="sub">사주로 보는 내 기질·성향·적성</span></div>
<div class="main">

<!-- LEFT -->
<div class="panel">
  <div class="section-title">📋 사주 입력</div>
  <div class="row">
    <div class="field"><label>생년</label><input type="number" id="inYear" value="2000" min="1920" max="2010"></div>
    <div class="field"><label>월</label><select id="inMonth"></select></div>
    <div class="field"><label>일</label><select id="inDay"></select></div>
  </div>
  <div class="opt-row">
    <label><input type="radio" name="cal" value="solar" checked> 양력</label>
    <label><input type="radio" name="cal" value="lunar"> 음력</label>
    <label><input type="radio" name="cal" value="leap"> 윤달</label>
  </div>
  <label>시간</label>
  <div class="time-tabs"><div class="time-tab active" onclick="setTimeMode('ganji',this)">간지</div><div class="time-tab" onclick="setTimeMode('direct',this)">시:분</div></div>
  <div id="timeGanji"><select id="inGanji"></select></div>
  <div id="timeDirect" style="display:none"><div class="row"><div class="field"><label>시</label><select id="inHour"></select></div><div class="field"><label>분</label><select id="inMin"></select></div></div></div>
  <div class="opt-row" style="margin-top:6px">
    <label><input type="checkbox" id="chkNoTime"> 시간 모름</label>
    <label><input type="checkbox" id="chkYaja"> 야자시 적용안함</label>
  </div>
  <div class="row">
    <div class="field"><label>성별</label><select id="inGender"><option value="여">여</option><option value="남">남</option></select></div>
    <div class="field"><label>나이</label><div class="age-display" id="ageDisplay">—</div></div>
  </div>
  <div class="opt-row"><label><input type="radio" name="agetype" value="kr" checked> 한국나이</label><label><input type="radio" name="agetype" value="man"> 만나이</label></div>
  <button class="btn btn-gold" onclick="doCalc()">🔮 만세력 조회</button>
  <hr class="divider">
  <div class="section-title">🀄 사주 원국</div>
  <div id="sajuCardArea"><div class="saju-card"><div class="pillar-row"><div class="pillar"><div class="lbl">시주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div><div class="pillar"><div class="lbl">일주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div><div class="pillar"><div class="lbl">월주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div><div class="pillar"><div class="lbl">년주</div><div class="gan" style="color:var(--text3)">·</div><div class="ji" style="color:var(--text3)">·</div></div></div></div><div class="placeholder">생년월일을 입력하세요</div></div>
  <hr class="divider">
  <div class="section-title">📖 일주·월주 해석</div>
  <div id="interpArea"><div class="placeholder">만세력 조회 후 자동 표시됩니다.</div></div>
</div>

<!-- CENTER -->
<div class="panel">
  <div class="section-title">💼 직업 선택</div>
  <button class="job-select-btn" id="jobSelectBtn" onclick="openJobModal()">🏷️ 직업 선택 (클릭)</button>
  <div id="jobRecArea"></div>
  <div id="centerResult"><div class="placeholder">만세력 조회 후 결과가 표시됩니다</div></div>
</div>

<!-- RIGHT -->
<div class="panel">
  <div class="section-title">📊 성향 프로필</div>
  <div id="rightResult"><div class="placeholder">만세력 조회 후 표시됩니다</div></div>
</div>
</div>

<!-- JOB MODAL -->
<div class="modal-overlay" id="jobModal">
  <div class="modal">
    <div class="modal-header"><h2>🏷️ 직업 선택</h2><button class="modal-close" onclick="closeJobModal()">✕</button></div>
    <div class="modal-body" id="jobModalBody"></div>
    <div class="modal-footer"><button class="btn btn-sub" onclick="closeJobModal()">취소</button><button class="btn btn-gold" onclick="confirmJob()">✓ 선택 확인</button></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import{calculateSaju}from'https://cdn.jsdelivr.net/npm/ssaju@0.2.0/dist/index.mjs';window._ssaju=calculateSaju;
</script>
<script>
const STEMS='甲乙丙丁戊己庚辛壬癸'.split(''),BRANCHES='子丑寅卯辰巳午未申酉戌亥'.split('');
const ELEM_MAP={'甲':'목','乙':'목','丙':'화','丁':'화','戊':'토','己':'토','庚':'금','辛':'금','壬':'수','癸':'수','子':'수','丑':'토','寅':'목','卯':'목','辰':'토','巳':'화','午':'화','未':'토','申':'금','酉':'금','戌':'토','亥':'수'};
const ELEM_COLOR={목:'var(--wood)',화:'var(--fire)',토:'var(--earth)',금:'var(--metal)',수:'var(--water)'};
const OC={목:'oh-wood',화:'oh-fire',토:'oh-earth',금:'oh-metal',수:'oh-water'};

const GANJI_HOURS=[{label:'자시 子 (23:00~01:00)',h:0},{label:'축시 丑 (01:00~03:00)',h:2},{label:'인시 寅 (03:00~05:00)',h:4},{label:'묘시 卯 (05:00~07:00)',h:6},{label:'진시 辰 (07:00~09:00)',h:8},{label:'사시 巳 (09:00~11:00)',h:10},{label:'오시 午 (11:00~13:00)',h:12},{label:'미시 未 (13:00~15:00)',h:14},{label:'신시 申 (15:00~17:00)',h:16},{label:'유시 酉 (17:00~19:00)',h:18},{label:'술시 戌 (19:00~21:00)',h:20},{label:'해시 亥 (21:00~23:00)',h:22}];

const STEM_TEXT={'甲':'거침없는 선구자. 큰 나무처럼 곧고 당당하며 한번 정한 방향은 꺾이지 않는다.','乙':'유연한 적응가. 덩굴처럼 어디든 뿌리내리며 부드러움 속에 강인함이 있다.','丙':'타오르는 열정가. 태양 같은 에너지로 주변을 밝히며 무대 위에서 빛난다.','丁':'정밀한 통찰가. 촛불 같은 집중력으로 깊이 파고들며 디테일에서 승부를 건다.','戊':'흔들림 없는 기반. 산처럼 묵직하고 신뢰감 있으며 위기에 강하다.','己':'포용하는 관리자. 대지처럼 모든 것을 수용하며 실리와 조화를 추구한다.','庚':'날카로운 실행가. 강철 같은 결단력으로 밀어붙이며 원칙에 타협하지 않는다.','辛':'빛나는 완벽주의자. 보석 같은 정교함을 추구하며 디테일에서 차이를 만든다.','壬':'깊은 전략가. 대해 같은 지혜로 큰 그림을 보며 유연하게 흐름을 읽는다.','癸':'직관의 관찰자. 비처럼 조용히 스며들며 남들이 못 보는 것을 감지한다.'};
const BRANCH_TEXT={'子':'내면에 학구적 호기심이 끓는다. 혼자만의 시간에 최고 성과.','丑':'차곡차곡 쌓는 실질적 내면. 느리지만 확실한 성장 추구.','寅':'모험심과 도전 의지가 강하다. 미지의 영역에 두려움 없음.','卯':'감성과 표현력이 풍부. 사람과의 교류에서 에너지를 얻는다.','辰':'야심과 변화를 품은 내면. 현재에 안주하지 않는 변혁가.','巳':'사색적이고 통찰력 있는 내면. 복잡한 문제를 단순화하는 능력.','午':'에너지 넘치고 열정적. 행동이 빠르며 순발력이 좋다.','未':'따뜻하고 수용적인 내면. 갈등 상황에서 중재자 역할.','申':'재빠르고 영리한 내면. 새 도구·기술을 빠르게 습득.','酉':'정교하고 미적 감각이 뛰어남. 퀄리티에 높은 기준 적용.','戌':'의리와 원칙을 지키는 내면. 팀에서 가장 믿을 수 있는 사람.','亥':'깊고 넓은 사고. 융합적 사고로 새로운 가치를 만든다.'};

function countTG(r){const c={};['year','month','day','hour'].forEach(p=>{if(!r.tenGods?.[p])return;[r.tenGods[p].stem,r.tenGods[p].branch].forEach(t=>{if(t&&t!=='(일간)'&&t!=='일간')c[t]=(c[t]||0)+1;});});return c;}
function tgVal(tg,names){let s=0;names.forEach(n=>s+=(tg[n]||0));return s;}

const STAT_KEYS=['재물력','놀기력','리더력','학습력','독립력'];
function calcStats(r,tg){
  const st={재물력:tgVal(tg,['편재','정재'])*14,놀기력:tgVal(tg,['식신','상관'])*14,리더력:tgVal(tg,['편관','정관'])*14,학습력:tgVal(tg,['편인','정인'])*14,독립력:tgVal(tg,['비견','겁재'])*14};
  const gk=r.advanced?.geukguk||'';
  if(gk.includes('재'))st.재물력+=15;else if(gk.includes('식상'))st.놀기력+=15;else if(gk.includes('관'))st.리더력+=15;else if(gk.includes('인수')||gk.includes('인성'))st.학습력+=15;else if(gk.includes('비겁'))st.독립력+=15;
  if(r.advanced?.dayStrength?.strength==='strong')st.독립력+=10;else st.학습력+=10;
  for(const k of STAT_KEYS)st[k]=Math.max(5,Math.min(100,st[k]));
  st['종합']=Math.round(st.재물력*.2+st.놀기력*.2+st.리더력*.25+st.학습력*.15+st.독립력*.2);
  return st;
}

// MBTI
function calcMBTI(tg){
  const ext=tgVal(tg,['식신','상관','편재','정재']),intr=tgVal(tg,['편인','정인','비견','겁재']);
  const sns=tgVal(tg,['편재','정재','편관','정관']),ntu=tgVal(tg,['식신','상관','편인','정인']);
  const thk=tgVal(tg,['편관','정관','비견','겁재']),fee=tgVal(tg,['식신','상관','편재','정재']);
  const jdg=tgVal(tg,['정관','정재','정인']),prc=tgVal(tg,['편관','편재','편인','상관']);
  return (ext>intr?'E':'I')+(sns>ntu?'S':'N')+(thk>fee?'T':'F')+(jdg>=prc?'J':'P');
}

// SVG RADAR
function radarSVG(axes,color,size=130){
  const cx=size/2,cy=size/2,r=size/2-22,n=axes.length;
  const ang=(i)=>-Math.PI/2+2*Math.PI*i/n;
  const pt=(i,v)=>[(cx+r*(v/100)*Math.cos(ang(i))).toFixed(1),(cy+r*(v/100)*Math.sin(ang(i))).toFixed(1)];
  let svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  // grid
  [25,50,75,100].forEach(lv=>{let pts='';for(let i=0;i<n;i++){const[x,y]=pt(i,lv);pts+=`${x},${y} `;}svg+=`<polygon points="${pts}" fill="none" stroke="#2a2f42" stroke-width=".5"/>`;});
  for(let i=0;i<n;i++){const[x,y]=pt(i,100);svg+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2a2f42" stroke-width=".5"/>`;}
  // data
  let dpts='';axes.forEach((a,i)=>{const[x,y]=pt(i,a.value);dpts+=`${x},${y} `;});
  svg+=`<polygon points="${dpts}" fill="${color}30" stroke="${color}" stroke-width="2"/>`;
  axes.forEach((a,i)=>{const[x,y]=pt(i,a.value);svg+=`<circle cx="${x}" cy="${y}" r="3" fill="${color}"/>`;});
  // labels
  axes.forEach((a,i)=>{const[x,y]=pt(i,120);const lines=a.label.split('\n');lines.forEach((l,li)=>{svg+=`<text x="${x}" y="${(+y)+li*11}" text-anchor="middle" fill="#8a8fa6" font-size="9" font-family="Noto Sans KR">${l}</text>`;});});
  svg+='</svg>';return svg;
}

function getOh(r){if(r.fiveElements)return r.fiveElements;const oh={목:0,화:0,토:0,금:0,수:0};['year','month','day','hour'].forEach(k=>{const p=r.pillarDetails?.[k];if(!p)return;const se=ELEM_MAP[p.stem];if(se)oh[se]++;const be=ELEM_MAP[p.branch];if(be)oh[be]++;});return oh;}

  const pd=r.pillarDetails,ds=pd?.day?.stem||'甲',db=pd?.day?.branch||'子',ilju=ds+db;
  const sorted=STAT_KEYS.map(k=>({k,v:st[k]})).sort((a,b)=>b.v-a.v);
  const typeName=TYPE_NAMES[sorted[0].k+'_'+sorted[1].k]||'균형형 ⚖️';
  const mbti=calcMBTI(S.tg);

  let h=`<div class="type-card"><div class="type-name">${STEM_ADJ[ds]||''} ${typeName}</div><div class="type-sub">${ilju} · ${r.advanced?.geukguk||'—'}</div></div>`;
  h+=`<div class="mbti-card"><div class="mbti-code">${mbti}</div><div class="mbti-desc">${MBTI_DESC[mbti]||''}</div></div>`;
  h+=`<div style="text-align:center;margin-bottom:var(--gap)"><span class="strength-tag" style="background:#ffd74030;color:#ffd740">강점: ${sorted[0].k}</span><span class="strength-tag" style="background:var(--surface3);color:var(--text3)">약점: ${sorted[4].k}</span></div>`;
  // stat bars
  const SM=[{key:'재물력',icon:'💰',color:'var(--stat-money)'},{key:'놀기력',icon:'🎉',color:'var(--stat-play)'},{key:'리더력',icon:'👑',color:'var(--stat-lead)'},{key:'학습력',icon:'🧠',color:'var(--stat-study)'},{key:'독립력',icon:'⚔️',color:'var(--stat-solo)'}];
  SM.forEach(s=>{const v=st[s.key];h+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="font-size:14px;width:20px;text-align:center">${s.icon}</span><span style="width:42px;font-size:10px;color:var(--text2);font-weight:700">${s.key}</span><div style="flex:1;height:20px;background:var(--surface3);border-radius:10px;overflow:hidden"><div style="height:100%;width:${v}%;background:${s.color};border-radius:10px;position:relative"><span style="position:absolute;right:6px;top:2px;font-size:10px;font-weight:800;color:#111">${v}</span></div></div></div>`;});
  h+=`<div style="text-align:center;padding:8px;background:var(--surface3);border-radius:var(--radius);border:1px solid var(--border);margin-top:4px"><span style="font-size:10px;color:var(--text2)">종합 전투력</span><br><span style="font-family:'Space Grotesk';font-size:30px;font-weight:700;color:var(--gold)">${st.종합}</span></div>`;
  document.getElementById('centerResult').innerHTML=h;
}

function updateJobRec(){
  if(!S.stats){document.getElementById('jobRecArea').innerHTML='';return;}
  const st=S.stats;
  // 추천 카테고리 상위 3개
  const ranked=JOB_CATS.map(c=>({...c,score:Math.round(st[c.primary]*.7+st[c.secondary]*.3)})).sort((a,b)=>b.score-a.score);
  const top3=ranked.slice(0,3);
  const totalJobs=JOB_CATS.reduce((s,c)=>s+c.jobs.length,0);
  const matchJobs=top3.reduce((s,c)=>s+c.jobs.length,0);
  let h=`<div class="job-rec"><strong>📌 사주 기반 추천 직군</strong><br>`;
  top3.forEach((c,i)=>h+=`${i+1}. ${c.cat} (${c.score}%) — ${c.jobs.length}개 직업<br>`);
  h+=`<br>전체 ${totalJobs}개 직업 중 <strong>${matchJobs}개</strong>가 높은 적성 (상위 3개 카테고리)</div>`;
  document.getElementById('jobRecArea').innerHTML=h;
}

// RIGHT: RADAR + PROFILE
function renderRight(){
  if(!S.radar)return;
  let h='';
  h+='<div class="radar-grid">';
  for(const[title,data]of Object.entries(S.radar)){
    h+=`<div class="radar-box"><div class="r-title" style="color:${data.color}">${title}</div>${radarSVG(data.axes,data.color)}</div>`;
  }
  h+='</div>';
  // 종합 프로필 카드
  const pd=S.saju.pillarDetails,ds=pd?.day?.stem||'甲',db=pd?.day?.branch||'子',mb=pd?.month?.branch||'子';
  const mbti=calcMBTI(S.tg);
  const sorted=STAT_KEYS.map(k=>({k,v:S.stats[k]})).sort((a,b)=>b.v-a.v);
  const typeName=TYPE_NAMES[sorted[0].k+'_'+sorted[1].k]||'균형형';
  h+=`<div class="right-card"><div style="font-size:11px;font-weight:800;color:var(--gold);margin-bottom:6px">📋 종합 프로필</div>
    <div style="font-size:12px;line-height:1.7;color:var(--text)">
    <b>${ds+db}일주</b>의 당신은 <b>${STEM_ADJ[ds]}</b> 기질의 <b>${typeName.replace(/[^\w가-힣]/g,'')}</b>.<br>
    MBTI 추정: <b style="color:var(--stat-lead)">${mbti}</b><br>
    강점 영역: <b>${sorted[0].k}</b> · <b>${sorted[1].k}</b><br>
    보완 영역: <b>${sorted[4].k}</b> · <b>${sorted[3].k}</b><br>
    격국: ${S.saju.advanced?.geukguk||'—'} · 강약: ${S.saju.advanced?.dayStrength?.strength==='strong'?'신강':'신약'}
    </div></div>`;
  document.getElementById('rightResult').innerHTML=h;
}

// JOB MODAL
window.openJobModal=function(){
  const st=S.stats;
  let banner='';
  if(st){
    const ranked=JOB_CATS.map(c=>({...c,score:Math.round(st[c.primary]*.7+st[c.secondary]*.3)})).sort((a,b)=>b.score-a.score);
    const top=ranked.slice(0,3).map(c=>c.cat);
    banner=`<div class="modal-rec-banner"><strong>📌 추천 직군:</strong> ${top.join(', ')}<br><span style="font-size:11px;color:var(--text2)">★ 표시 = 사주 적성 높은 카테고리</span></div>`;
  }
  const body=document.getElementById('jobModalBody');
  body.innerHTML=banner+JOB_CATS.map(c=>{
    const isRec=st&&(Math.round(st[c.primary]*.7+st[c.secondary]*.3)>=60);
    return `<div class="jcat-title">${c.cat}${isRec?'<span class="rec-badge">★ 추천</span>':''}</div><div class="jcat-grid">${c.jobs.map(j=>`<button class="jcat-btn${S.jobName===j?' active':''}" data-job="${j}" data-cat="${c.cat}" onclick="pickJob(this)">${j}</button>`).join('')}</div>`;
  }).join('');
  document.getElementById('jobModal').classList.add('show');tempJob=S.jobName;tempJobCat=S.jobCat;
};
window.closeJobModal=function(){document.getElementById('jobModal').classList.remove('show');};
window.pickJob=function(el){document.querySelectorAll('.jcat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');tempJob=el.dataset.job;tempJobCat=el.dataset.cat;};
window.confirmJob=function(){if(!tempJob){toast('직업을 선택하세요');return;}S.jobName=tempJob;S.jobCat=tempJobCat;S.job=JOB_CATS.find(c=>c.cat===tempJobCat);document.getElementById('jobSelectBtn').textContent='🏷️ '+tempJob+' ('+tempJobCat+')';document.getElementById('jobSelectBtn').classList.add('selected');closeJobModal();if(S.stats)renderCenter();};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
</body>
</html>
